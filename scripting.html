<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/scripting_tabs.css">
    <!-- V3: CodeMirror for Syntax Highlighting (bundled locally) -->
    <link rel="stylesheet" href="js/libs/codemirror/codemirror.min.css">
    <link rel="stylesheet" href="js/libs/codemirror/material-darker.min.css">
    <script src="js/libs/codemirror/codemirror.min.js"></script>
    <script src="js/libs/codemirror/javascript.min.js"></script>
    <title>TATA Scripting</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            color: #f0f0f0;
        }

        .scripting-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            /* Fill all available space */
            padding: 10px;
            box-sizing: border-box;
            gap: 10px;
            min-height: 0;
            overflow: hidden;
        }

        /* Tab content should fill available space */
        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        /* V3 FIX: Override styles.css padding which was meant for Main Panel */
        .tab-content.active {
            padding-bottom: 0 !important;
        }

        .tab-content:not(.active) {
            display: none !important;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            background: #252525;
            border: 1px solid #3e3e3e;
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-bubble {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 12px;
            line-height: 1.4;
        }

        .chat-bubble.ai {
            background: #2b2b2b;
            border: 1px solid #444;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-bubble.user {
            background: #0078d4;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Input Area */
        .prompt-box {
            display: flex;
            gap: 8px;
        }

        .prompt-box textarea {
            flex: 1;
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
            resize: none;
            height: 40px;
            font-family: inherit;
        }

        .prompt-box button {
            width: auto;
            margin: 0;
            height: auto;
        }

        /* Code Editor */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-height: 0;
            /* Critical for flex scroll */
            overflow: hidden;
        }

        .editor-container .CodeMirror {
            flex: 1;
            height: 100% !important;
            min-height: 200px;
            overflow: auto;
        }

        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-label {
            font-size: 11px;
            font-weight: bold;
            color: #aaa;
        }

        #code_editor {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', monospace;
            padding: 10px;
            font-size: 12px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        /* Bottom Actions */
        .action-bar {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid #333;
            margin-top: auto;
            /* Push to bottom */
            flex-shrink: 0;
        }

        /* Toast uses styles from styles.css - position fixed handled there */

        .loading-dots {
            display: inline-block;
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60% {
                content: '...';
            }

            80%,
            100% {
                content: '';
            }
        }
    </style>
</head>

<body>

    <div class="scripting-container">
        <!-- Tabs -->
        <div class="tabs" style="margin-bottom: 5px;">
            <div class="tab-btn active" data-tab="tab_editor"
                style="flex: 1; text-align: center; border-bottom: 2px solid transparent;">Editor</div>
            <div class="tab-btn" data-tab="tab_ai"
                style="flex: 1; text-align: center; border-bottom: 2px solid transparent;">AI Helper</div>
        </div>

        <!-- Tab Content: Editor -->
        <div id="tab_editor" class="tab-content active" style="display: flex; flex-direction: column; flex: 1;">
            <!-- Code Section -->
            <div class="editor-container">
                <div class="editor-toolbar">
                    <span class="editor-label">SCRIPT EDITOR (JSX)</span>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="script_name_input" placeholder="Script Name"
                            style="background: #333; border: 1px solid #444; color: #fff; padding: 2px 6px; width: 120px;">
                        <!-- Custom Icons Picker -->
                        <div style="position: relative;">
                            <input type="hidden" id="icon_value" value="★">
                            <button id="icon_trigger"
                                style="width: 32px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; background: #333; border: 1px solid #444; cursor: pointer;">
                                ★
                            </button>
                            <!-- Icon Grid Popover -->
                            <div id="icon_grid_popover"
                                style="display: none; position: absolute; top: 30px; right: 0; width: 220px; background: #252525; border: 1px solid #444; padding: 8px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 100; grid-template-columns: repeat(5, 1fr); gap: 4px;">
                                <!-- Js will inject buttons here -->
                            </div>
                        </div>
                        <!-- V3: Version History Button -->
                        <button id="btn_version_history" title="Version History"
                            style="width: 32px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; background: #333; border: 1px solid #444; cursor: pointer; font-size: 14px;">
                            ↩
                        </button>
                    </div>
                </div>
                <textarea id="code_editor" spellcheck="false">// Your code will appear here...</textarea>
            </div>

            <!-- Actions -->
            <div class="action-bar">
                <button id="btn_test" class="secondary">Test Run</button>
                <div style="flex: 1;"></div>
                <button id="btn_import" class="primary" style="background: #27ae60; border-color: #2ecc71;">Import to
                    TATA</button>
            </div>
        </div>

        <!-- Tab Content: AI Helper -->
        <div id="tab_ai" class="tab-content" style="display: none; flex-direction: column; flex: 1;">
            <!-- Chat Section -->
            <div class="chat-area" id="chat_history" style="position: relative;">
                <!-- V3: Copy Last Code Button -->
                <button id="btn_copy_code" title="Copy Last Code"
                    style="position: absolute; top: 6px; right: 36px; width: 24px; height: 24px; padding: 0; display: flex; align-items: center; justify-content: center; background: #333; border: 1px solid #444; border-radius: 4px; color: #888; cursor: pointer; z-index: 10; font-size: 14px;">📋</button>
                <button id="btn_clear_chat" title="Clear Chat"
                    style="position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; padding: 0; display: flex; align-items: center; justify-content: center; background: #333; border: 1px solid #444; border-radius: 4px; color: #888; cursor: pointer; z-index: 10; font-size: 14px;">🗑️</button>
                <div class="chat-bubble ai">
                    Hello! I'm TATA AI. usage: "Create a circle of 50px"
                </div>
            </div>

            <!-- Smart Words Suggestions -->
            <div id="smart_words_container"
                style="display: flex; gap: 5px; flex-wrap: wrap; padding: 5px 0; min-height: 28px;">
                <!-- Chips injected by JS -->
            </div>


            <div class="prompt-box" style="margin-top: 5px;">
                <textarea id="prompt_input" placeholder="Ask AI to create or edit script..."></textarea>
                <button id="btn_send_prompt" class="primary">
                    <span class="icon">✨</span>
                </button>
            </div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification">Code updated!</div>

    <!-- Toast Container -->

    <script src="js/libs/CSInterface.js"></script>
    <script src="js/scripting.js"></script>
</body>

</html>

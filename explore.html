<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>TATA Explore</title>
    <link rel="stylesheet" href="css/explore.css">
</head>

<body>
    <!-- Header -->
    <div class="explore-header">
        <h1>🔍 Explore</h1>
        <button class="btn-upload" id="btn_open_upload">➕ Upload</button>
    </div>

    <!-- Search & Filter -->
    <div class="search-bar">
        <input type="text" id="search_input" placeholder="Search...">
        <select id="sort_filter">
            <option value="trending">🔥 Trending</option>
            <option value="newest">🆕 Newest</option>
            <option value="downloads">📥 Downloads</option>
        </select>
        <select id="category_filter">
            <option value="all">All</option>
            <option value="swift">Swift</option>
            <option value="creative">Creative</option>
            <option value="tools">Tools</option>
        </select>
    </div>

    <!-- Tabs -->
    <div class="explore-tabs">
        <button class="explore-tab active" data-type="scripts">📜 Scripts</button>
        <button class="explore-tab" data-type="plugins">📦 Plugins</button>
    </div>

    <!-- Content Grid -->
    <div id="explore_content" class="explore-grid">
        <div class="loading">Loading...</div>
    </div>

    <!-- Empty State -->
    <div id="empty_state" class="empty-state" style="display: none;">
        <span class="empty-icon">🔍</span>
        <p>No scripts found</p>
    </div>

    <!-- Upload Modal -->
    <div id="upload_modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📤 Upload Script</h2>
                <button class="modal-close" id="btn_close_upload">&times;</button>
            </div>

            <div class="form-group">
                <label>Script Name</label>
                <input type="text" id="upload_name" placeholder="My Awesome Script">
            </div>

            <div class="form-group">
                <label>Icon (Emoji)</label>
                <input type="text" id="upload_icon" placeholder="⭐" maxlength="2" value="⭐">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="upload_category">
                    <option value="tools">Tools</option>
                    <option value="swift">Swift</option>
                    <option value="creative">Creative</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <input type="text" id="upload_desc" placeholder="What does this script do?">
            </div>

            <div class="form-group">
                <label>Your Name (Optional)</label>
                <input type="text" id="upload_author" placeholder="Anonymous">
            </div>

            <div class="form-group">
                <label>JSX Code</label>
                <textarea id="upload_code" placeholder="// Your ExtendScript code here..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" id="btn_cancel_upload">Cancel</button>
                <button class="btn-submit" id="btn_submit_upload">🚀 Upload</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="js/libs/CSInterface.js"></script>
    <script src="js/explore.js"></script>
</body>

</html>

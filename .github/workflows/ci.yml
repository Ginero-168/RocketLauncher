name: Validate Extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run JavaScript tests
        run: npm test -- --runInBand

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js tests/*.js; do
            node --check "$file"
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, mbstring, pdo_mysql

      - name: Check PHP syntax
        run: |
          find market-backend -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Run Marketplace site tests
        working-directory: market-backend
        run: php tests/run.php

      - name: Check whitespace
        run: git diff --check

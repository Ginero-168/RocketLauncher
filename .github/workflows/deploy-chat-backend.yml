name: Deploy Chat Backend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'chat-backend/**'
      - '.github/workflows/deploy-chat-backend.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate chat-config.json from GitHub Secrets
        working-directory: chat-backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ROOM_PASSWORD: ${{ secrets.CHAT_ROOM_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os

          cfg = {
              'db_host': os.environ.get('DB_HOST', 'localhost'),
              'db_name': os.environ.get('DB_NAME', ''),
              'db_user': os.environ.get('DB_USER', ''),
              'db_pass': os.environ.get('DB_PASS', ''),
              'db_charset': 'utf8mb4',
              'room_password': os.environ.get('ROOM_PASSWORD', ''),
          }

          if not cfg['db_name'] or not cfg['db_user']:
              print('WARNING: DB_NAME and/or DB_USER secret is empty.')
              print('chat-config.json will be created with empty values.')
              print('Run setup.php in the browser to fill in credentials manually.')

          with open('chat-config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print('Generated chat-backend/chat-config.json')
          PYEOF

      - name: Deploy chat-backend to Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PYEOF'
          import ftplib
          import os
          import sys

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          remote_dir = os.environ['FTP_REMOTE_DIR']
          local_dir = 'chat-backend'

          def mkdir_p(ftp, path):
              # Create remote directory tree relative to the current FTP working directory.
              parts = [p for p in path.split('/') if p]
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          # No files are deleted during deploy. setup.php/ping.php can be removed manually after use.
          def upload_dir(ftp, local, remote_prefix):
              for root, dirs, files in os.walk(local):
                  rel = os.path.relpath(root, local)
                  remote_root = remote_prefix.rstrip('/')
                  if rel != '.':
                      rel_path = rel.replace('\\', '/')
                      remote_root = (remote_root + '/' + rel_path) if remote_root else rel_path

                  if remote_root:
                      try:
                          ftp.mkd(remote_root)
                      except ftplib.error_perm:
                          pass

                  for name in files:
                      local_path = os.path.join(root, name)
                      remote_path = (remote_root + '/' + name) if remote_root else name
                      with open(local_path, 'rb') as f:
                          ftp.storbinary('STOR ' + remote_path, f)
                      print('Uploaded', remote_path)

          print('FTP server:', server)
          print('FTP remote dir:', remote_dir)

          ftp = None
          try:
              # Hostinger shared hosting default is plain FTP on port 21
              ftp = ftplib.FTP(server)
              ftp.login(username, password)
              ftp.set_pasv(True)
              print('Connected via plain FTP')
          except Exception as e:
              print('Plain FTP failed:', e)
              try:
                  ftp = ftplib.FTP_TLS(server)
                  ftp.login(username, password)
                  ftp.prot_p()
                  ftp.set_pasv(True)
                  print('Connected via FTPS')
              except Exception as e2:
                  print('FTP connection failed:', e2, file=sys.stderr)
                  sys.exit(1)

          print('FTP home dir:', ftp.pwd())

          # Move into (and create if needed) the target directory, relative to FTP home
          mkdir_p(ftp, remote_dir)
          print('FTP target dir:', ftp.pwd())

          upload_dir(ftp, local_dir, '')
          print('Remote files after upload:', ftp.nlst())

          ftp.quit()
          print('Deploy complete')
          PYEOF

      - name: Install config.php on server
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          # Domain is the part after the first dot in the FTP username, e.g. u123.domain.com -> domain.com
          domain="${FTP_USERNAME#*.}"
          backend_url="https://${domain}/chat-backend"
          echo "Backend URL: $backend_url"

          # Wait for the PHP file to become executable through Hostinger's sync layer
          for i in 1 2 3 4 5; do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$backend_url/install-config.php")
              echo "install-config.php HTTP status: $status"
              if [ "$status" = "200" ] || [ "$status" = "405" ]; then break; fi
              sleep 10
          done

          # POST credentials to the installer so it writes chat-config.json on the server filesystem.
          curl -f -sS -X POST "$backend_url/install-config.php" \
              -d "token=${{ secrets.DB_PASS }}" \
              -d "db_host=${{ secrets.DB_HOST }}" \
              -d "db_name=${{ secrets.DB_NAME }}" \
              -d "db_user=${{ secrets.DB_USER }}" \
              -d "db_pass=${{ secrets.DB_PASS }}" \
              -d "room_password=${{ secrets.CHAT_ROOM_PASSWORD }}"

      - name: Post-deploy notes
        run: |
          echo "Deployment finished."
          echo "Backend URL: https://yourdomain.com/chat-backend"
          echo "Run https://yourdomain.com/chat-backend/admin.php to set an admin password."

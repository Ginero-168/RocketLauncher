name: Deploy Chat Backend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'chat-backend/**'
      - '.github/workflows/deploy-chat-backend.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate config.php from GitHub Secrets
        working-directory: chat-backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ROOM_PASSWORD: ${{ secrets.CHAT_ROOM_PASSWORD }}
          CLEANUP_DAYS: ${{ secrets.CLEANUP_DAYS }}
        run: |
          python3 - <<'PYEOF'
          import os

          def q(s):
              if s is None:
                  return "''"
              # Escape single quotes and backslashes for PHP single-quoted strings
              escaped = s.replace('\\', '\\\\').replace("'", "\\'")
              return "'" + escaped + "'"

          cleanup = os.environ.get('CLEANUP_DAYS', '')
          try:
              cleanup_days = int(cleanup) if cleanup.strip() else 30
          except ValueError:
              cleanup_days = 30

          cfg = (
              "<?php\n"
              f"define('DB_HOST', {q(os.environ.get('DB_HOST', 'localhost'))});\n"
              f"define('DB_NAME', {q(os.environ.get('DB_NAME', ''))});\n"
              f"define('DB_USER', {q(os.environ.get('DB_USER', ''))});\n"
              f"define('DB_PASS', {q(os.environ.get('DB_PASS', ''))});\n"
              "define('DB_CHARSET', 'utf8mb4');\n"
              f"define('ROOM_PASSWORD', {q(os.environ.get('ROOM_PASSWORD', ''))});\n"
              f"define('CLEANUP_DAYS', {cleanup_days});\n"
          )

          with open('config.php', 'w', encoding='utf-8') as f:
              f.write(cfg)

          print('Generated chat-backend/config.php')
          PYEOF

      - name: Deploy chat-backend to Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PYEOF'
          import ftplib
          import os
          import sys

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          remote_dir = os.environ['FTP_REMOTE_DIR']
          local_dir = 'chat-backend'

          def mkdir_p(ftp, path):
              # Create remote directory tree relative to the current FTP working directory.
              parts = [p for p in path.split('/') if p]
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          def upload_dir(ftp, local, remote_prefix):
              for root, dirs, files in os.walk(local):
                  rel = os.path.relpath(root, local)
                  remote_root = remote_prefix.rstrip('/')
                  if rel != '.':
                      rel_path = rel.replace('\\', '/')
                      remote_root = (remote_root + '/' + rel_path) if remote_root else rel_path

                  if remote_root:
                      try:
                          ftp.mkd(remote_root)
                      except ftplib.error_perm:
                          pass

                  for name in files:
                      local_path = os.path.join(root, name)
                      remote_path = (remote_root + '/' + name) if remote_root else name
                      with open(local_path, 'rb') as f:
                          ftp.storbinary('STOR ' + remote_path, f)
                      print('Uploaded', remote_path)

          ftp = None
          try:
              # Hostinger shared hosting default is plain FTP on port 21
              ftp = ftplib.FTP(server)
              ftp.login(username, password)
              ftp.set_pasv(True)
              print('Connected via plain FTP')
          except Exception as e:
              print('Plain FTP failed:', e)
              try:
                  ftp = ftplib.FTP_TLS(server)
                  ftp.login(username, password)
                  ftp.prot_p()
                  ftp.set_pasv(True)
                  print('Connected via FTPS')
              except Exception as e2:
                  print('FTP connection failed:', e2, file=sys.stderr)
                  sys.exit(1)

          # Move into (and create if needed) the target directory, relative to FTP home
          mkdir_p(ftp, remote_dir)
          upload_dir(ftp, local_dir, '')
          ftp.quit()
          print('Deploy complete')
          PYEOF

      - name: Post-deploy notes
        run: |
          echo "Deployment finished."
          echo "Visit https://yourdomain.com/chat-backend/ping.php to verify."
          echo "Then visit https://yourdomain.com/chat-backend/setup.php to create the database table."
          echo "Remember to delete setup.php and ping.php after setup for security."

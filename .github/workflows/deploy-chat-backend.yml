name: Deploy Chat Backend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'chat-backend/**'
      - '.github/workflows/deploy-chat-backend.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tata-env.php from GitHub Secrets
        working-directory: chat-backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64
          import json
          import os
          import sys

          cfg = {
              'db_host': os.environ.get('DB_HOST', 'localhost'),
              'db_name': os.environ.get('DB_NAME', ''),
              'db_user': os.environ.get('DB_USER', ''),
              'db_pass': os.environ.get('DB_PASS', ''),
              'db_charset': 'utf8mb4',
              'admin_setup_token': os.environ.get('ADMIN_SETUP_TOKEN', ''),
          }

          missing = [name for name, value in {
              'DB_NAME': cfg['db_name'],
              'DB_USER': cfg['db_user'],
              'DB_PASS': cfg['db_pass'],
              'ADMIN_SETUP_TOKEN': cfg['admin_setup_token'],
          }.items() if not value]
          if missing:
              sys.exit('Missing required GitHub Secrets: ' + ', '.join(missing))
          if len(cfg['admin_setup_token']) < 12:
              sys.exit('ADMIN_SETUP_TOKEN must be at least 12 characters')

          b64 = base64.b64encode(json.dumps(cfg, ensure_ascii=False).encode('utf-8')).decode('utf-8')
          with open('tata-env.php', 'w', encoding='utf-8') as f:
              f.write("<?php\n")
              f.write("// Auto-generated by deploy workflow. Do not edit manually.\n")
              f.write("$tataEnv = json_decode(base64_decode('" + b64 + "'), true);\n")
          print('Generated chat-backend/tata-env.php')
          PYEOF

      - name: Deploy chat-backend to Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          python3 - <<'PYEOF'
          import ftplib
          import os
          import sys

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          remote_dir = os.environ['FTP_REMOTE_DIR']
          local_dir = 'chat-backend'

          def mkdir_p(ftp, path):
              # Create remote directory tree relative to the current FTP working directory.
              parts = [p for p in path.split('/') if p]
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          excluded_runtime_files = {'setup.php', 'ping.php', 'install-config.php'}

          def upload_dir(ftp, local, remote_prefix):
              for root, dirs, files in os.walk(local):
                  rel = os.path.relpath(root, local)
                  remote_root = remote_prefix.rstrip('/')
                  if rel != '.':
                      rel_path = rel.replace('\\', '/')
                      remote_root = (remote_root + '/' + rel_path) if remote_root else rel_path

                  if remote_root:
                      try:
                          ftp.mkd(remote_root)
                      except ftplib.error_perm:
                          pass

                  for name in files:
                      if rel == '.' and name in excluded_runtime_files:
                          print('Skipped runtime-only file', name)
                          continue
                      local_path = os.path.join(root, name)
                      remote_path = (remote_root + '/' + name) if remote_root else name
                      with open(local_path, 'rb') as f:
                          ftp.storbinary('STOR ' + remote_path, f)
                      print('Uploaded', remote_path)

          print('FTP server:', server)
          print('FTP remote dir:', remote_dir)

          try:
              # Secrets and the generated runtime config must never cross the
              # network over plain FTP. Fail closed when FTPS is unavailable.
              ftp = ftplib.FTP_TLS(server)
              ftp.login(username, password)
              ftp.prot_p()
              ftp.set_pasv(True)
              print('Connected via FTPS')
          except Exception as e:
              print('Encrypted FTP connection failed:', e, file=sys.stderr)
              sys.exit(1)

          print('FTP home dir:', ftp.pwd())

          # Move into (and create if needed) the target directory, relative to FTP home
          mkdir_p(ftp, remote_dir)
          print('FTP target dir:', ftp.pwd())

          upload_dir(ftp, local_dir, '')
          for retired in excluded_runtime_files:
              try:
                  ftp.delete(retired)
                  print('Removed unsafe runtime file', retired)
              except ftplib.error_perm:
                  pass
          print('Remote files after upload:', ftp.nlst())

          ftp.quit()
          print('Deploy complete')
          PYEOF

      - name: Post-deploy notes
        run: |
          echo "Deployment finished."
          echo "Backend URL: https://yourdomain.com/chat-backend"
          echo "Run https://yourdomain.com/chat-backend/admin.php to set an admin password."
